testcases:
  - prompt: Identify every animal in every document
    expectations:
      root:
        - get_scope
      get_scope:
        - classify_span
      classify_span:
        - highlight
      highlight:
        - respond
    scope: all documents
    layer:
    feature:
    exclude:
      - annotate

  - prompt: How fast does a cheetah run?
    expectations:
      root:
        - search_context
      search_context:
        - respond
    scope: current document
    layer:
    feature:

  - prompt: Annotate every animal as either four-legged, two-legged or other.
    expectations:
      root:
        - get_scope
        - get_layer_and_feature
      get_scope:
        - classify_span
      get_layer_and_feature:
        - annotate
      classify_span:
        - annotate
      annotate:
        - respond
    scope: current document
    layer: Animal
    feature: numberoflegs

  - prompt: How often is the word 'cheetah' annotated?
    expectations:
      root:
        - search_annotations
      search_annotations:
        - respond
    scope: current document
    layer:
    feature:

  - prompt: Check if every annotation with the dog label also accurately describes the animal cheetah
    expectations:
      root:
        - search_annotations
      search_annotations:
        - respond
    scope: current document
    layer:
    feature:

  - prompt: Tell me a joke
    expectations:
      root:
        - respond
    scope:
    layer:
    feature:

  - prompt: What kind of animal is the cheetah?
    expectations:
      root:
        - search_context
      search_context:
        - respond
    scope: current document
    layer:
    feature:

  - prompt: Annotate every animal as such
    expectations:
      root:
        - get_scope
        - get_layer_and_feature
      get_scope:
        - classify_span
      get_layer_and_feature:
        - annotate
      classify_span:
        - annotate
      annotate:
        - respond
    scope: current document
    layer: Animal
    feature: Species

  - prompt: Annotate every mention of cheetah
    expectations:
