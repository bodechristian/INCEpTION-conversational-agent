    expectations:
      root:
        - summarize_document
      summarize_document:
        - respond
    scope: current document
    layer:
    feature:

  - prompt: Identify every animal in every document, but dont annotate them directly.
    expectations:
      root:
        - get_scope
      get_scope:
        - classify_span
      classify_span:
        - highlight
      highlight:
        - respond
    exclude:
      - annotate
    scope: all documents
    layer: Animal
    feature: Species
